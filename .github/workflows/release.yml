name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - rid: win-x64
            binary-ext: .exe
          - rid: win-arm64
            binary-ext: .exe
          # Linux
          - rid: linux-x64
            binary-ext: ''
          - rid: linux-arm64
            binary-ext: ''
          # macOS
          - rid: osx-x64
            binary-ext: ''
          - rid: osx-arm64
            binary-ext: ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Self-contained build (standalone, .NET not required)
      - name: Publish Self-Contained (${{ matrix.rid }})
        run: >
          dotnet publish src/UI/UI.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:EventSourceSupport=false
          -p:HttpActivityPropagationSupport=false
          -o ./dist/self-contained

      # Framework-dependent build (lightweight single-file, requires .NET 10)
      - name: Publish Framework-Dependent (${{ matrix.rid }})
        run: >
          dotnet publish src/UI/UI.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./dist/framework-dependent

        # Preparing and renaming binaries
      - name: Prepare Binaries
        run: |
          mkdir -p ./release-binaries
          
          cp ./dist/self-contained/WB_Addon_Helper${{ matrix.binary-ext }} \
             ./release-binaries/WB_Addon_Helper-${{ matrix.rid }}${{ matrix.binary-ext }}
          
          cp ./dist/framework-dependent/WB_Addon_Helper${{ matrix.binary-ext }} \
             ./release-binaries/WB_Addon_Helper-framework-dependent-${{ matrix.rid }}${{ matrix.binary-ext }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.rid }}
          path: ./release-binaries/*
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"* %s (%h)")
            COMPARE_LINK=""
          else
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)")
            COMPARE_LINK="**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}"
          fi
          
          {
            echo "body<<EOF"
            echo "### What's Changed"
            echo "$COMMITS"
            echo ""
            echo "$COMPARE_LINK"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}